services:
  postgres:
    image: postgres:16
    container_name: postgres-commandcenter
    environment:
      POSTGRES_DB: commandcenter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - commandcenter-network

volumes:
  postgres_data:

networks:
  commandcenter-network:
    driver: bridge

